archivesBaseName = project.archives_base_name + "-api"
version = getSubprojectVersion(project)

moduleDependencies(project, [
        "banner-transitive-access-wideners"
])

processResources {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

def annotationsVersion = "26.0.2"
// Keep in sync with paper-server adventure-text-serializer-ansi dep
def adventureVersion = "4.21.0"
def bungeeCordChatVersion = "1.21-R0.2-deprecated+build.21"
def slf4jVersion = "2.0.16"
def log4jVersion = "2.24.1"

configurations {
    apiAndDocs {
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.DOCUMENTATION))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(DocsType.DOCS_TYPE_ATTRIBUTE, objects.named(DocsType, DocsType.SOURCES))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
    api.extendsFrom(apiAndDocs)
}

dependencies {
    include("net.minecraftforge:srgutils:0.4.13")

    // api dependencies are listed transitively to API consumers
    api("com.google.guava:guava:33.3.1-jre")
    api("com.google.code.gson:gson:2.11.0")
    api("org.yaml:snakeyaml:2.2")
    api("org.joml:joml:1.10.8") {
        transitive = false // https://github.com/JOML-CI/JOML/issues/352
    }
    api("it.unimi.dsi:fastutil:8.5.15")
    api("org.apache.logging.log4j:log4j-api:$log4jVersion")
    api("org.slf4j:slf4j-api:$slf4jVersion")
    api("com.mojang:brigadier:1.3.10")

    apiAndDocs(platform("net.kyori:adventure-bom:$adventureVersion"))
    apiAndDocs("net.kyori:adventure-api")
    apiAndDocs("net.kyori:adventure-text-minimessage")
    apiAndDocs("net.kyori:adventure-text-serializer-gson")
    apiAndDocs("net.kyori:adventure-text-serializer-legacy")
    apiAndDocs("net.kyori:adventure-text-serializer-plain")
    apiAndDocs("net.kyori:adventure-text-logger-slf4j")

    api("org.apache.maven:maven-resolver-provider:3.9.6") // make API dependency for Paper Plugins
}