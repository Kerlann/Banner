plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = getSubprojectVersion(project)
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	// Chemin relatif au dossier du module
	accessWidenerPath = file("src/main/resources/banner.accesswidener")
}

dependencies {
	include(rootProject.project("banner-translate"))
	include(rootProject.project("banner-bukkit-manager"))
	include("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")
}